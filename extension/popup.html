<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font: 14px system-ui, sans-serif;
        width: 260px;
        margin: 0;
        padding: 14px;
        color: #000;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 10px;
      }
      button {
        width: 100%;
        padding: 8px;
        border: 1px solid #000;
        background: #000;
        color: #fff;
        cursor: pointer;
        font: inherit;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      p {
        margin: 10px 0 0;
        line-height: 1.4;
      }
      .error {
        color: #b00020;
      }
    </style>
  </head>
  <body>
    <h1>Recap for Canvas</h1>
    <button id="extract">Extract this page</button>
    <p id="status"></p>
    <script src="popup.js"></script>
  </body>
</html>
